<svg width="850" height="300"
     viewBox="0 0 850 300"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="2.5"/>
</filter>

</defs>

<!-- BACKGROUND -->
<rect width="850"
      height="300"
      rx="20"
      fill="url(#bg)"
      stroke="#1e293b"/>


<!-- TITLE -->
<text x="32"
      y="42"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
  📈 Development Activity
</text>

<text x="32"
      y="64"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="11">
  Coding activity visualization
</text>


<!-- GRAPH AXIS -->

<line x1="58"
      y1="235"
      x2="790"
      y2="235"
      stroke="#1e293b"/>

<line x1="58"
      y1="85"
      x2="58"
      y2="235"
      stroke="#1e293b"/>


<!-- AREA -->

<path
d="M58 218
   L110 197
   L162 210
   L214 152
   L266 177
   L318 127
   L370 160
   L422 102
   L474 135
   L526 114
   L578 147
   L630 94
   L682 123
   L734 85
   L790 106
   L790 235
   L58 235 Z"
fill="#00d9ff"
opacity="0.07"/>


<!-- GLOW LINE -->

<polyline
points="
58,218
110,197
162,210
214,152
266,177
318,127
370,160
422,102
474,135
526,114
578,147
630,94
682,123
734,85
790,106"
fill="none"
stroke="#00d9ff"
stroke-width="2.5"
filter="url(#glow)">

<animate
attributeName="stroke-dasharray"
from="0,1800"
to="1800,0"
dur="3s"
fill="freeze"/>

</polyline>


<!-- MAIN LINE -->

<polyline
points="
58,218
110,197
162,210
214,152
266,177
318,127
370,160
422,102
474,135
526,114
578,147
630,94
682,123
734,85
790,106"
fill="none"
stroke="#00d9ff"
stroke-width="2"/>


<!-- POINTS -->

<g fill="#00d9ff">

<circle cx="58" cy="218" r="4">
<animate attributeName="r"
values="3;7;3"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="214" cy="152" r="4">
<animate attributeName="r"
values="3;7;3"
dur="2.2s"
repeatCount="indefinite"/>
</circle>

<circle cx="422" cy="102" r="4">
<animate attributeName="r"
values="3;7;3"
dur="1.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="630" cy="94" r="4">
<animate attributeName="r"
values="3;7;3"
dur="2.4s"
repeatCount="indefinite"/>
</circle>

<circle cx="790" cy="106" r="4">
<animate attributeName="r"
values="3;7;3"
dur="2s"
repeatCount="indefinite"/>
</circle>

</g>


<!-- LABELS -->

<text x="58"
      y="260"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="10">
  Start
</text>

<text x="360"
      y="260"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="10">
  Development Journey
</text>

<text x="750"
      y="260"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="10">
  Today
</text>

</svg>
