<svg width="850"
     height="360"
     viewBox="0 0 850 360"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<linearGradient id="line">
  <stop offset="0%" stop-color="#00d9ff"/>
  <stop offset="50%" stop-color="#8b5cf6"/>
  <stop offset="100%" stop-color="#22c55e"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="3"/>
</filter>

</defs>


<!-- BACKGROUND -->

<rect width="850"
      height="360"
      rx="20"
      fill="url(#bg)"
      stroke="#1e293b"/>


<!-- TITLE -->

<text x="425"
      y="38"
      text-anchor="middle"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
  🎯 Current Focus
</text>


<!-- MAIN LINE -->

<line x1="425"
      y1="65"
      x2="425"
      y2="315"
      stroke="url(#line)"
      stroke-width="2.5"
      stroke-dasharray="8 8">

<animate
attributeName="stroke-dashoffset"
from="0"
to="-32"
dur="1s"
repeatCount="indefinite"/>

</line>


<!-- NODE 1 -->

<g>

<circle cx="425"
        cy="75"
        r="21"
        fill="#071426"
        stroke="#00d9ff"
        stroke-width="2.5"/>

<text x="425"
      y="81"
      text-anchor="middle"
      font-size="14">
  🚀
</text>

<text x="460"
      y="81"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="14"
      font-weight="bold">
  Backend Development
</text>

</g>


<!-- NODE 2 -->

<g>

<circle cx="425"
        cy="130"
        r="19"
        fill="#071426"
        stroke="#6366f1"
        stroke-width="2.5"/>

<text x="460"
      y="135"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="13">
  🐍 Django / Django REST Framework
</text>

</g>


<!-- NODE 3 -->

<g>

<circle cx="425"
        cy="185"
        r="19"
        fill="#071426"
        stroke="#8b5cf6"
        stroke-width="2.5"/>

<text x="460"
      y="190"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="13">
  🔌 Advanced REST APIs
</text>

</g>


<!-- NODE 4 -->

<g>

<circle cx="425"
        cy="240"
        r="19"
        fill="#071426"
        stroke="#f97316"
        stroke-width="2.5"/>

<text x="460"
      y="245"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="13">
  ⚡ Async Processing
</text>

</g>


<!-- NODE 5 -->

<g>

<circle cx="425"
        cy="295"
        r="19"
        fill="#071426"
        stroke="#ef4444"
        stroke-width="2.5"/>

<text x="460"
      y="300"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="13">
  🔴 Celery + Redis
</text>

</g>


<!-- FINAL -->

<rect x="220"
      y="320"
      width="410"
      height="27"
      rx="14"
      fill="#071426"
      stroke="#22c55e"/>

<text x="425"
      y="338"
      text-anchor="middle"
      fill="#22c55e"
      font-family="Arial, sans-serif"
      font-size="11"
      font-weight="bold">
  🐳 Docker • 📡 Real-Time • ☁️ Scalable Applications
</text>

</svg>
