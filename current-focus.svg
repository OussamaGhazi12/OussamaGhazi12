<svg width="1000"
     height="500"
     viewBox="0 0 1000 500"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<linearGradient id="line">
  <stop offset="0%" stop-color="#00d9ff"/>
  <stop offset="50%" stop-color="#8b5cf6"/>
  <stop offset="100%" stop-color="#22c55e"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5"/>
</filter>

</defs>

<rect width="1000"
      height="500"
      rx="24"
      fill="url(#bg)"
      stroke="#1e293b"/>


<!-- TITLE -->

<text x="500"
      y="50"
      text-anchor="middle"
      fill="white"
      font-family="Arial"
      font-size="26"
      font-weight="bold">
  🎯 Current Focus
</text>


<!-- MAIN LINE -->

<line x1="500"
      y1="90"
      x2="500"
      y2="430"
      stroke="url(#line)"
      stroke-width="3"
      stroke-dasharray="10 10">

<animate
attributeName="stroke-dashoffset"
from="0"
to="-40"
dur="1s"
repeatCount="indefinite"/>

</line>


<!-- NODE 1 -->

<g>

<circle cx="500"
        cy="100"
        r="28"
        fill="#071426"
        stroke="#00d9ff"
        stroke-width="3"/>

<text x="500"
      y="107"
      text-anchor="middle"
      fill="#00d9ff"
      font-family="Arial"
      font-size="18">
  🚀
</text>

<text x="540"
      y="106"
      fill="white"
      font-family="Arial"
      font-size="17"
      font-weight="bold">
  Backend Development
</text>

</g>


<!-- NODE 2 -->

<g>

<circle cx="500"
        cy="170"
        r="24"
        fill="#071426"
        stroke="#6366f1"
        stroke-width="3"/>

<text x="540"
      y="176"
      fill="white"
      font-family="Arial"
      font-size="16">
  🐍 Django / Django REST Framework
</text>

</g>


<!-- NODE 3 -->

<g>

<circle cx="500"
        cy="240"
        r="24"
        fill="#071426"
        stroke="#8b5cf6"
        stroke-width="3"/>

<text x="540"
      y="246"
      fill="white"
      font-family="Arial"
      font-size="16">
  🔌 Advanced REST APIs
</text>

</g>


<!-- NODE 4 -->

<g>

<circle cx="500"
        cy="310"
        r="24"
        fill="#071426"
        stroke="#f97316"
        stroke-width="3"/>

<text x="540"
      y="316"
      fill="white"
      font-family="Arial"
      font-size="16">
  ⚡ Async Processing
</text>

</g>


<!-- NODE 5 -->

<g>

<circle cx="500"
        cy="380"
        r="24"
        fill="#071426"
        stroke="#ef4444"
        stroke-width="3"/>

<text x="540"
      y="386"
      fill="white"
      font-family="Arial"
      font-size="16">
  🔴 Celery + Redis
</text>

</g>


<!-- FINAL -->

<rect x="260"
      y="435"
      width="480"
      height="42"
      rx="21"
      fill="#071426"
      stroke="#22c55e"/>

<text x="500"
      y="462"
      text-anchor="middle"
      fill="#22c55e"
      font-family="Arial"
      font-size="15"
      font-weight="bold">
  🐳 Docker • 📡 Real-Time • ☁️ Scalable Applications
</text>

</svg>
