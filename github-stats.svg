<svg width="850" height="260" viewBox="0 0 850 260"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" x2="1">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="850"
      height="260"
      rx="20"
      fill="url(#bg)"
      stroke="#1e293b"/>


<!-- TITLE -->

<text x="32"
      y="40"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
  📊 GitHub Statistics
</text>

<text x="32"
      y="62"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="11">
  OussamaGhazi12 — Developer Activity
</text>


<!-- COMMITS -->

<rect x="32"
      y="88"
      width="240"
      height="135"
      rx="16"
      fill="#071426"
      stroke="#00d9ff"
      stroke-width="1.5"/>

<text x="53"
      y="115"
      fill="#00d9ff"
      font-family="Arial, sans-serif"
      font-size="12">
  COMMITS
</text>

<text x="53"
      y="160"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="30"
      font-weight="bold">
  ACTIVE
</text>

<text x="53"
      y="188"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="11">
  Consistent development
</text>

<circle cx="245"
        cy="115"
        r="7"
        fill="#00d9ff"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="5;10;5"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<!-- PROJECTS -->

<rect x="292"
      y="88"
      width="240"
      height="135"
      rx="16"
      fill="#071426"
      stroke="#8b5cf6"
      stroke-width="1.5"/>

<text x="313"
      y="115"
      fill="#a78bfa"
      font-family="Arial, sans-serif"
      font-size="12">
  PROJECTS
</text>

<text x="313"
      y="160"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="30"
      font-weight="bold">
  FULL STACK
</text>

<text x="313"
      y="188"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="11">
  Backend + Frontend
</text>

<circle cx="505"
        cy="115"
        r="7"
        fill="#a78bfa"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="5;10;5"
    dur="2.5s"
    repeatCount="indefinite"/>

</circle>


<!-- CURRENT FOCUS -->

<rect x="552"
      y="88"
      width="266"
      height="135"
      rx="16"
      fill="#071426"
      stroke="#22c55e"
      stroke-width="1.5"/>

<text x="573"
      y="115"
      fill="#22c55e"
      font-family="Arial, sans-serif"
      font-size="12">
  CURRENT FOCUS
</text>

<text x="573"
      y="153"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
  Backend Engineering
</text>

<text x="573"
      y="181"
      fill="#94a3b8"
      font-family="Arial, sans-serif"
      font-size="11">
  Django • Laravel • APIs • Docker
</text>

<text x="573"
      y="201"
      fill="#94a3b8"
      font-family="Arial, sans-serif"
      font-size="11">
  Async • Redis • Real-Time
</text>

<circle cx="790"
        cy="115"
        r="7"
        fill="#22c55e"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="5;10;5"
    dur="1.8s"
    repeatCount="indefinite"/>

</circle>

</svg>
