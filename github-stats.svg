<svg width="1000" height="300" viewBox="0 0 1000 300"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" x2="1">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="100%" stop-color="#6366f1"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Background -->

<rect width="1000"
      height="300"
      rx="24"
      fill="url(#bg)"
      stroke="#1e293b"/>

<!-- Title -->

<text x="40"
      y="50"
      fill="white"
      font-family="Arial"
      font-size="24"
      font-weight="bold">
  📊 GitHub Statistics
</text>

<text x="40"
      y="76"
      fill="#64748b"
      font-family="Arial"
      font-size="13">
  OussamaGhazi12 — Developer Activity
</text>


<!-- COMMITS -->

<rect x="40"
      y="105"
      width="280"
      height="140"
      rx="18"
      fill="#071426"
      stroke="#00d9ff"
      stroke-width="1.5"/>

<text x="65"
      y="135"
      fill="#00d9ff"
      font-family="Arial"
      font-size="14">
  COMMITS
</text>

<text x="65"
      y="185"
      fill="white"
      font-family="Arial"
      font-size="38"
      font-weight="bold">
  ACTIVE
</text>

<text x="65"
      y="215"
      fill="#64748b"
      font-family="Arial"
      font-size="13">
  Consistent development
</text>

<circle cx="275"
        cy="135"
        r="8"
        fill="#00d9ff"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="6;12;6"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<!-- PROJECTS -->

<rect x="340"
      y="105"
      width="280"
      height="140"
      rx="18"
      fill="#071426"
      stroke="#8b5cf6"
      stroke-width="1.5"/>

<text x="365"
      y="135"
      fill="#a78bfa"
      font-family="Arial"
      font-size="14">
  PROJECTS
</text>

<text x="365"
      y="185"
      fill="white"
      font-family="Arial"
      font-size="38"
      font-weight="bold">
  FULL STACK
</text>

<text x="365"
      y="215"
      fill="#64748b"
      font-family="Arial"
      font-size="13">
  Backend + Frontend
</text>

<circle cx="575"
        cy="135"
        r="8"
        fill="#a78bfa"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="6;12;6"
    dur="2.5s"
    repeatCount="indefinite"/>

</circle>


<!-- FOCUS -->

<rect x="640"
      y="105"
      width="320"
      height="140"
      rx="18"
      fill="#071426"
      stroke="#22c55e"
      stroke-width="1.5"/>

<text x="665"
      y="135"
      fill="#22c55e"
      font-family="Arial"
      font-size="14">
  CURRENT FOCUS
</text>

<text x="665"
      y="175"
      fill="white"
      font-family="Arial"
      font-size="24"
      font-weight="bold">
  Backend Engineering
</text>

<text x="665"
      y="205"
      fill="#94a3b8"
      font-family="Arial"
      font-size="13">
  Django • Laravel • APIs • Docker
</text>

<text x="665"
      y="225"
      fill="#94a3b8"
      font-family="Arial"
      font-size="13">
  Async • Redis • Real-Time Systems
</text>

<circle cx="925"
        cy="135"
        r="8"
        fill="#22c55e"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="6;12;6"
    dur="1.8s"
    repeatCount="indefinite"/>

</circle>

</svg>
