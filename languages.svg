<svg width="1000" height="330" viewBox="0 0 1000 330"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4"/>
</filter>

</defs>

<rect width="1000"
      height="330"
      rx="24"
      fill="url(#bg)"
      stroke="#1e293b"/>

<text x="40"
      y="50"
      fill="white"
      font-family="Arial"
      font-size="24"
      font-weight="bold">
  💻 Technology Stack
</text>

<text x="40"
      y="75"
      fill="#64748b"
      font-family="Arial"
      font-size="13">
  Core technologies and development ecosystem
</text>


<!-- PYTHON -->

<text x="60"
      y="125"
      fill="white"
      font-family="Arial"
      font-size="14">
  Python
</text>

<rect x="160"
      y="110"
      width="700"
      height="22"
      rx="11"
      fill="#172033"/>

<rect x="160"
      y="110"
      width="520"
      height="22"
      rx="11"
      fill="#3776AB">

<animate
attributeName="width"
from="0"
to="520"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="880"
      y="126"
      fill="#3776AB"
      font-family="Arial"
      font-size="13"
      font-weight="bold">
  Python
</text>


<!-- JAVASCRIPT -->

<text x="60"
      y="165"
      fill="white"
      font-family="Arial"
      font-size="14">
  JavaScript
</text>

<rect x="160"
      y="150"
      width="700"
      height="22"
      rx="11"
      fill="#172033"/>

<rect x="160"
      y="150"
      width="470"
      height="22"
      rx="11"
      fill="#F7DF1E">

<animate
attributeName="width"
from="0"
to="470"
dur="1.5s"
begin="0.2s"
fill="freeze"/>

</rect>


<!-- PHP -->

<text x="60"
      y="205"
      fill="white"
      font-family="Arial"
      font-size="14">
  PHP
</text>

<rect x="160"
      y="190"
      width="700"
      height="22"
      rx="11"
      fill="#172033"/>

<rect x="160"
      y="190"
      width="410"
      height="22"
      rx="11"
      fill="#777BB4">

<animate
attributeName="width"
from="0"
to="410"
dur="1.5s"
begin="0.4s"
fill="freeze"/>

</rect>


<!-- SQL -->

<text x="60"
      y="245"
      fill="white"
      font-family="Arial"
      font-size="14">
  SQL / Databases
</text>

<rect x="160"
      y="230"
      width="700"
      height="22"
      rx="11"
      fill="#172033"/>

<rect x="160"
      y="230"
      width="450"
      height="22"
      rx="11"
      fill="#4169E1">

<animate
attributeName="width"
from="0"
to="450"
dur="1.5s"
begin="0.6s"
fill="freeze"/>

</rect>


<!-- FRAMEWORKS -->

<text x="60"
      y="285"
      fill="white"
      font-family="Arial"
      font-size="14">
  Frameworks
</text>

<rect x="160"
      y="270"
      width="700"
      height="22"
      rx="11"
      fill="#172033"/>

<rect x="160"
      y="270"
      width="560"
      height="22"
      rx="11"
      fill="#22c55e">

<animate
attributeName="width"
from="0"
to="560"
dur="1.5s"
begin="0.8s"
fill="freeze"/>

</rect>

</svg>
