<svg width="850" height="290" viewBox="0 0 850 290"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="3"/>
</filter>

</defs>


<!-- BACKGROUND -->

<rect width="850"
      height="290"
      rx="20"
      fill="url(#bg)"
      stroke="#1e293b"/>


<!-- TITLE -->

<text x="32"
      y="40"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
  💻 Technology Stack
</text>

<text x="32"
      y="62"
      fill="#64748b"
      font-family="Arial, sans-serif"
      font-size="11">
  Core technologies and development ecosystem
</text>


<!-- PYTHON -->

<text x="45"
      y="105"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="12">
  Python
</text>

<rect x="140"
      y="91"
      width="600"
      height="19"
      rx="10"
      fill="#172033"/>

<rect x="140"
      y="91"
      width="445"
      height="19"
      rx="10"
      fill="#3776AB">

<animate
attributeName="width"
from="0"
to="445"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="755"
      y="105"
      fill="#3776AB"
      font-family="Arial, sans-serif"
      font-size="11"
      font-weight="bold">
  Python
</text>


<!-- JAVASCRIPT -->

<text x="45"
      y="143"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="12">
  JavaScript
</text>

<rect x="140"
      y="129"
      width="600"
      height="19"
      rx="10"
      fill="#172033"/>

<rect x="140"
      y="129"
      width="402"
      height="19"
      rx="10"
      fill="#F7DF1E">

<animate
attributeName="width"
from="0"
to="402"
dur="1.5s"
begin="0.2s"
fill="freeze"/>

</rect>


<!-- PHP -->

<text x="45"
      y="181"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="12">
  PHP
</text>

<rect x="140"
      y="167"
      width="600"
      height="19"
      rx="10"
      fill="#172033"/>

<rect x="140"
      y="167"
      width="351"
      height="19"
      rx="10"
      fill="#777BB4">

<animate
attributeName="width"
from="0"
to="351"
dur="1.5s"
begin="0.4s"
fill="freeze"/>

</rect>


<!-- SQL -->

<text x="45"
      y="219"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="12">
  SQL / Databases
</text>

<rect x="140"
      y="205"
      width="600"
      height="19"
      rx="10"
      fill="#172033"/>

<rect x="140"
      y="205"
      width="386"
      height="19"
      rx="10"
      fill="#4169E1">

<animate
attributeName="width"
from="0"
to="386"
dur="1.5s"
begin="0.6s"
fill="freeze"/>

</rect>


<!-- FRAMEWORKS -->

<text x="45"
      y="257"
      fill="white"
      font-family="Arial, sans-serif"
      font-size="12">
  Frameworks
</text>

<rect x="140"
      y="243"
      width="600"
      height="19"
      rx="10"
      fill="#172033"/>

<rect x="140"
      y="243"
      width="480"
      height="19"
      rx="10"
      fill="#22c55e">

<animate
attributeName="width"
from="0"
to="480"
dur="1.5s"
begin="0.8s"
fill="freeze"/>

</rect>

</svg>
