<svg width="850" height="500" viewBox="0 0 850 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6"
                    flood-color="#000000"
                    flood-opacity="0.5"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="850"
        height="500"
        rx="20"
        fill="url(#bg)"/>


  <!-- PARTICLES -->

  <g fill="#38bdf8" opacity="0.35">

    <circle cx="70" cy="75" r="2">
      <animate attributeName="opacity"
               values="0.1;1;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="780" cy="90" r="2">
      <animate attributeName="opacity"
               values="1;0.1;1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="730" cy="430" r="2">
      <animate attributeName="opacity"
               values="0.1;1;0.1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- TITLE -->

  <text x="425"
        y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="white">
    🚀 Main Features
  </text>

  <line x1="330" y1="57"
        x2="520" y2="57"
        stroke="url(#blue)"
        stroke-width="2"
        filter="url(#glow)"/>


  <!-- MAIN CONNECTION -->

  <line x1="425" y1="105"
        x2="425" y2="350"
        stroke="#38bdf8"
        stroke-width="2.5"
        stroke-dasharray="7 10"
        filter="url(#glow)">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-34"
      dur="1s"
      repeatCount="indefinite"/>

  </line>


  <!-- CARD 1 -->

  <g filter="url(#shadow)">

    <rect x="275" y="78"
          width="300"
          height="58"
          rx="15"
          fill="#071426"
          stroke="#00d9ff"
          stroke-width="1.5"/>

    <circle cx="308" cy="107"
            r="19"
            fill="#061d31"
            stroke="#00d9ff"
            stroke-width="2"/>

    <text x="308" y="114"
          text-anchor="middle"
          font-size="17">
      🔐
    </text>

    <text x="345" y="101"
          font-family="Arial"
          font-size="10"
          fill="#00d9ff"
          font-weight="bold">
      01
    </text>

    <text x="345" y="120"
          font-family="Arial"
          font-size="15"
          fill="white"
          font-weight="bold">
      Authentication
    </text>

  </g>


  <!-- CARD 2 -->

  <g filter="url(#shadow)">

    <rect x="275" y="148"
          width="300"
          height="58"
          rx="15"
          fill="#071426"
          stroke="#22c55e"
          stroke-width="1.5"/>

    <circle cx="308" cy="177"
            r="19"
            fill="#071d16"
            stroke="#22c55e"
            stroke-width="2"/>

    <text x="308" y="184"
          text-anchor="middle"
          font-size="17">
      🛡️
    </text>

    <text x="345" y="171"
          font-family="Arial"
          font-size="10"
