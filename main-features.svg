      Async processing
    </text>

  </g>


  <!-- BOTTOM CARD 2 -->

  <g filter="url(#shadow)">

    <rect x="330" y="390"
          width="190"
          height="65"
          rx="14"
          fill="#071426"
          stroke="#00d9ff"
          stroke-width="1.5"/>

    <text x="348" y="414"
          font-family="Arial"
          font-size="10"
