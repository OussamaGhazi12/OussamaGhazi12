  <!-- CARD 3 -->

  <g filter="url(#shadow)">

    <rect x="275" y="218"
          width="300"
          height="58"
          rx="15"
          fill="#071426"
          stroke="#a855f7"
          stroke-width="1.5"/>

    <circle cx="308" cy="247"
            r="19"
            fill="#171029"
            stroke="#a855f7"
            stroke-width="2"/>

    <text x="308" y="254"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          fill="#a855f7">
      &lt;/&gt;
    </text>

    <text x="345" y="241"
          font-family="Arial"
          font-size="10"
          fill="#a855f7"
          font-weight="bold">
      03
    </text>

    <text x="345" y="260"
          font-family="Arial"
          font-size="15"
          fill="white"
          font-weight="bold">
      REST API
    </text>

  </g>


  <!-- CARD 4 -->

  <g filter="url(#shadow)">

    <rect x="275" y="288"
          width="300"
          height="58"
          rx="15"
          fill="#071426"
          stroke="#f97316"
          stroke-width="1.5"/>

    <circle cx="308" cy="317"
            r="19"
            fill="#241508"
            stroke="#f97316"
            stroke-width="2"/>

    <text x="308" y="324"
          text-anchor="middle"
          font-size="17">
      ⚙️
    </text>

    <text x="345" y="311"
          font-family="Arial"
          font-size="10"
          fill="#f97316"
          font-weight="bold">
      04
    </text>

    <text x="345" y="330"
          font-family="Arial"
          font-size="15"
          fill="white"
          font-weight="bold">
      Business Logic
    </text>

  </g>


  <!-- CONNECTIONS -->

  <path d="M425 346
           L425 365
           L140 365
           L140 390"
        fill="none"
        stroke="#ff4d4d"
        stroke-width="2"
        stroke-dasharray="8 8"/>

  <path d="M425 346
           L425 390"
        fill="none"
        stroke="#00d9ff"
        stroke-width="2"
        stroke-dasharray="8 8"/>

  <path d="M425 346
           L425 365
           L710 365
           L710 390"
        fill="none"
        stroke="#facc15"
        stroke-width="2"
        stroke-dasharray="8 8"/>


  <!-- BOTTOM CARD 1 -->

  <g filter="url(#shadow)">

    <rect x="45" y="390"
          width="190"
          height="65"
          rx="14"
          fill="#071426"
          stroke="#ff4d4d"
          stroke-width="1.5"/>

    <text x="63" y="414"
          font-family="Arial"
          font-size="10"
          fill="#ff4d4d"
          font-weight="bold">
