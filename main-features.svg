    </text>

    <text x="348" y="434"
          font-family="Arial"
          font-size="14"
          fill="white"
          font-weight="bold">
      Real-Time SSE
    </text>

    <text x="348" y="449"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">
      Live updates
    </text>

  </g>


  <!-- BOTTOM CARD 3 -->

  <g filter="url(#shadow)">

    <rect x="615" y="390"
          width="190"
          height="65"
          rx="14"
          fill="#071426"
          stroke="#facc15"
          stroke-width="1.5"/>

    <text x="633" y="414"
          font-family="Arial"
          font-size="10"
          fill="#facc15"
          font-weight="bold">
      07
    </text>

    <text x="633" y="434"
          font-family="Arial"
          font-size="14"
          fill="white"
          font-weight="bold">
      Stripe + Webhooks
    </text>

    <text x="633" y="449"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">
      Secure payments
    </text>

  </g>


  <!-- FOOTER -->

  <text x="425"
        y="480"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        fill="#64748b">
    ⚡ All components work together seamlessly
  </text>


  <!-- ENERGY PARTICLE -->

  <circle cx="425" cy="110"
          r="4"
          fill="#00d9ff"
          filter="url(#glow)">

    <animate
      attributeName="cy"
      values="110;345;110"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>

</svg>
